name: Publish built APK

on:
  push:
    branches:
      - "arena/824a4509-menager-game"
    paths:
      - .github/workflows/publish-built-apk.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download successful APK build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "38088820544"
        run: |
          artifact_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "FootballManagerContinental-Android") | .id')"
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > apk-artifact.zip
          mkdir -p artifacts
          unzip -q apk-artifact.zip -d artifacts
          test -s artifacts/FootballManagerContinental-debug.apk
          expected="$(cut -d ' ' -f 1 artifacts/FootballManagerContinental-debug.apk.sha256)"
          actual="$(sha256sum artifacts/FootballManagerContinental-debug.apk | cut -d ' ' -f 1)"
          test "$actual" = "$expected"

      - name: Publish APK to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/FootballManagerContinental-debug.apk
          git add -f artifacts/FootballManagerContinental-debug.apk.sha256
          git rm .github/workflows/publish-built-apk.yml
          git commit -m "Update installable Android APK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
