name: Publish built APK

on:
  push:
    branches:
      - "arena/824a4509-menager-game"
    paths:
      - .github/workflows/publish-built-apk.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify hosted Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build current branch APK
        run: |
          npm ci
          npm run android:sync
          (cd android && ./gradlew assembleDebug --no-daemon --stacktrace)
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/FootballManagerContinental-debug.apk
          (cd artifacts && sha256sum FootballManagerContinental-debug.apk > FootballManagerContinental-debug.apk.sha256)
          (cd artifacts && sha256sum --check FootballManagerContinental-debug.apk.sha256)

      - name: Publish APK to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/FootballManagerContinental-debug.apk
          git add -f artifacts/FootballManagerContinental-debug.apk.sha256
          git rm .github/workflows/publish-built-apk.yml
          git commit -m "Update installable Android APK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
