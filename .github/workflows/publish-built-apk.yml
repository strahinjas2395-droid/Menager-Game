name: Publish built APK

on:
  push:
    branches:
      - "arena/824a4509-menager-game"
    paths:
      - .github/workflows/publish-built-apk.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download successful APK build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "38085456818"
        run: |
          mkdir -p artifacts
          gh run download "$SOURCE_RUN_ID" \
            --name FootballManagerContinental-Android \
            --dir artifacts
          test -s artifacts/FootballManagerContinental-debug.apk
          (cd artifacts && sha256sum --check FootballManagerContinental-debug.apk.sha256)

      - name: Publish APK to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/FootballManagerContinental-debug.apk
          git add -f artifacts/FootballManagerContinental-debug.apk.sha256
          git rm .github/workflows/publish-built-apk.yml
          git commit -m "Add installable Android APK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
