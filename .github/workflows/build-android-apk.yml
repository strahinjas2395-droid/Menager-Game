name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify hosted Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Export and sync the web application
        run: npm run android:sync

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Prepare downloadable artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FootballManagerContinental-debug.apk
          sha256sum FootballManagerContinental-debug.apk > FootballManagerContinental-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FootballManagerContinental-Android
          path: |
            FootballManagerContinental-debug.apk
            FootballManagerContinental-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
