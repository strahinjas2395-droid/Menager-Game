name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Export and sync the web application
        run: npm run android:sync

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Prepare downloadable artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FootballManagerContinental-debug.apk
          sha256sum FootballManagerContinental-debug.apk > FootballManagerContinental-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballManagerContinental-Android
          path: |
            FootballManagerContinental-debug.apk
            FootballManagerContinental-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
